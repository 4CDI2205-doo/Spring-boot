<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>エントリーシート管理アプリ</title>

        <script src="js/script.js" defer></script>
        <script src="js/pre-header.js" defer></script>
        <script src="js/register.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/form.css">
    </head>
    <body>
        <!-- JavaScriptでここにヘッダーを挿入 -->
        <div id="pre-headerplaceholder"></div>
        
        <main>
            <div id="container">
                <h1 class="main_target">新規登録</h1>
                <form id="newlogin_form">
                    <label for="user_name">名前：</label>
                    <input type="text" id="user_name" placeholder="例：佐藤　例">
                    <label for="user_email">email：</label>
                    <input type="email" id="user_email" placeholder="例：example@example.com">
                    <label for="user_pass">パスワード：</label>
                    <input type="password" id="user_pass" placeholder="例：12313565">
                    <label for="user_school">所属大学：</label>
                    <input type="text" id="user_school" placeholder="例：東海大学">
                    <label for="user_faculty">学部：</label>
                    <input type="text" id="user_faculty" placeholder="例：情報理工学部">
                    <label for="user_department">学科：</label>
                    <input type="text" id="user_department" placeholder="例：情報科学科">
                    <label for="user_age">年齢：</label>
                    <input type="number" id="user_age" min="1" placeholder="例：20">
                    <label for="user_date">生年月日：</label>
                    <input type="date" id="user_date" placeholder="例：2026/03/01">
                    <button id="form_submit" type="submit">登録</button>
                </form>
            </div>
        </main>
    </body>
</html>
