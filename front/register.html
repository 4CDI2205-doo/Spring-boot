<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>エントリーシート管理アプリ</title>

        <script src="js/script.js" defer></script>
        <script src="js/header.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/form.css">
    </head>
    <body>
        <!-- JavaScriptでここにヘッダーを挿入 -->
        <div id="headerplaceholder"></div>

        <main>
            <div id="container">
                <h1 class="main_target">新規登録</h1>
                <form id="register_form">
                    <label for="user_PR">自己PR：</label>
                    <textarea id="user_PR" rows="10" placeholder="ここに自己PRを400文字ほどで書いてください"></textarea>
                    <label for="user_CH">学生時代に力を入れたこと：</label>
                    <textarea id="user_CH" rows="10" placeholder="ここにガクチカを400文字ほどで書いてください"></textarea>
                    <label for="user_strong">あなたの強み：</label>
                    <textarea id="user_strong" rows="10" placeholder="ここにあなたの強みを400文字ほどで書いてください"></textarea>
                    <label for="user_PR">あなたの弱み：</label>
                    <textarea id="user_PR" rows="10" placeholder="ここにあなたの弱みを400文字ほどで書いてください"></textarea>
                    <button id="form_submit" type="submit">送信</button>
                </form>
    </body>
</html>
