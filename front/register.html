<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>使用者管理アプリ</title>

        <script src="js/script.js" defer></script>
        <script src="js/header.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/register.css">
    </head>
    <body>
        <!-- JavaScriptでここにヘッダーを挿入 -->
        <div id="headerplaceholder"></div>

        <form id="register_form">
            <label for="user_name">名前：</label>
            <input type="text" id="user_name" placeholder="例：佐藤　例">
            <label for="user_email">Email：</label>
            <input type="email" id="user_id" placeholder="例：example@example.com">
            <label for="user_barthday">生年月日：</label>
            <input type="date" id="user_barthday" placeholder="例：2026/03/01">
            <label for="user_team">所属：</label>
            <input type="text" id="user_team" placeholder="例：東海大学情報理工学部情報科学科">
        </form>
    </body>
</html>
