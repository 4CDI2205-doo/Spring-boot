<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>エントリーシート管理アプリ</title>

        <script src="js/header.js" defer></script>
        <script src="js/share.js" defer></script>
        <script src="js/Home.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/form.css">
    </head>
    <body>
        <!-- JavaScriptでここにヘッダーを挿入 -->
        <div id="headerplaceholder"></div>

        <!-- 検索フォーム -->
        <form class="companyFormSearch" id="companyFormSearch">
            <label for="companySearch"></label>
            <input id="companySearch" type="text" placeholder="企業名を入力">
            <button id="searchSubmitButton" type="submit">検索</button>
        </form>

        <!-- 検索企業一覧 -->
        <h1 id="companyListMain">検索結果</h1>
        <!-- JavaScriptでここに企業情報を挿入 -->
        <div id="searchHistory" class="history"></div>
        <button id="moreSearchButton">もっと見る</button>

        <!-- 登録した企業一覧 -->
        <h1 id="companyRegisterListMain">あなたが登録した企業</h1>
        <!-- JavaScriptでここに企業情報を挿入 -->
        <div id="history" class="history"></div>
        <button id="moreFavoriteButton">もっと見る</button>


        <!-- popupの型 -->
        <div id="popup" class="popup">
            <div class="popupContent">
                <h1 id="popupTitle"></h1>
                <hr>
                <p id="popupMessage"></p>
                <button id="closeButton">閉じる</button>
                <div class = "twoButtonControl">
                    <button id="yesButton">はい</button>
                    <button id="noButton">いいえ</button>
                </div>
            </div>
        </div>
        <!-- ここまでpopup -->
    </body>
</html>
