<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>エントリーシート管理アプリ</title>

        <script src="js/script.js" defer></script>
        <script src="js/header.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/form.css">
    </head>
    <body>
        <!-- JavaScriptでここにヘッダーを挿入 -->
        <div id="pre-headerplaceholder"></div>

        <main>
            <div class="container">
                <h1 class="main_target">ログイン</h1>
                <form id="login_form">
                    <label for="user_email">email：</label>
                    <input type="email" id="user_email" placeholder="例：example@example.com">
                    <label for="user_pass">パスワード：</label>
                    <input type="password" id="user_pass" placeholder="例：12313565">
                    <button id="form_submit" type="submit">送信</button>
                </form>
            </div>
        </main>
        
    </body>
</html>
